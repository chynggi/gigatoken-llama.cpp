name: Build Vast Docker image

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target (runtime, runtime-qwen, runtime-qwen-sharp, runtime-gemma)"
        type: choice
        options:
          - runtime
          - runtime-qwen
          - runtime-qwen-sharp
          - runtime-gemma
        default: runtime
      push:
        description: "Push to GHCR"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ inputs.push == true }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: meta
        shell: bash
        run: |
          TARGET="${{ inputs.target }}"
          if [[ "$TARGET" == "runtime" ]]; then
            SUFFIX=""
          else
            SUFFIX="-${TARGET#runtime-}"
          fi
          SHORT_SHA="${GITHUB_SHA::10}"
          echo "suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_REPO}:latest${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "image_sha=${IMAGE_REPO}:${SHORT_SHA}${SUFFIX}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.vast
          target: ${{ inputs.target }}
          push: ${{ inputs.push }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_sha }}
          cache-from: type=gha,scope=${{ inputs.target }}
          cache-to: type=gha,mode=max,scope=${{ inputs.target }}
          provenance: false
